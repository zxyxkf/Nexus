services:
  nexus-server:
    build: .
    container_name: nexus-server
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18632}:18632"
    env_file:
      - ./standalone-server/.env.production
    environment:
      - NODE_ENV=production
    volumes:
      - nexus-logs:/app/logs
      - nexus-uploads:/app/upload
      - nexus-data:/app/data
      - nexus-releases:/app/releases
      - D:/Nexus_BOX:/app/host-uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:18632/api/health',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # MySQL（.env.production 中 USE_MYSQL=1 时使用）
  mysql:
    image: mysql:8.0
    container_name: nexus-mysql
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-nexus-root-pwd}
      MYSQL_DATABASE: ${DB_NAME:-d_design_art}
      MYSQL_USER: ${DB_USER:-d_design}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Nexus@2026!Prod#MyDB}
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-nexus-root-pwd}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  nexus-logs:
  nexus-uploads:
  nexus-data:
  nexus-releases:
  mysql-data:
