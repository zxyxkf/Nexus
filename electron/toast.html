<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent;overflow:hidden;height:100%}
  #toast-root{position:fixed;bottom:0;right:0;display:flex;flex-direction:column-reverse;gap:10px;padding:0}

  .nt-toast{position:relative;width:380px;border-radius:10px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.14),0 1px 4px rgba(0,0,0,.1);overflow:hidden;cursor:pointer;opacity:0;transform:translateX(80px);transition:opacity .4s,transform .45s cubic-bezier(.22,1.3,.36,1)}
  .nt-toast.visible{opacity:1;transform:translateX(0)}
  .nt-toast.hiding{opacity:0;transform:scale(.92);transition:opacity .35s,transform .35s ease}

  .nt-accent{position:absolute;top:0;left:0;bottom:0;width:4px}
  .nt-toast.info    .nt-accent{background:#3b82f6}
  .nt-toast.success .nt-accent{background:#22c55e}
  .nt-toast.warning .nt-accent{background:#f59e0b}
  .nt-toast.error   .nt-accent{background:#ef4444}

  .nt-body{display:flex;align-items:flex-start;gap:12px;padding:14px 16px 10px 18px}

  .nt-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-top:2px}
  .nt-toast.info    .nt-icon{background:#eff6ff;color:#3b82f6}
  .nt-toast.success .nt-icon{background:#f0fdf4;color:#22c55e}
  .nt-toast.warning .nt-icon{background:#fffbeb;color:#f59e0b}
  .nt-toast.error   .nt-icon{background:#fef2f2;color:#ef4444}
  .nt-icon svg{display:block}

  .nt-text{flex:1;min-width:0}
  .nt-title{font-size:14px;font-weight:600;color:#1e293b;line-height:1.3;letter-spacing:-.01em;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .nt-content{font-size:12.5px;color:#64748b;margin-top:3px;line-height:1.45;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}

  .nt-close{flex-shrink:0;width:26px;height:26px;border:none;border-radius:6px;background:transparent;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:all .15s;font-size:18px;line-height:1}
  .nt-close:hover{background:#f1f5f9;color:#475569}

  .nt-progress{height:3px;background:#f1f5f9;margin:0 14px 0 18px;border-radius:0 0 6px 6px;overflow:hidden}
  .nt-progress-bar{height:100%;width:100%;border-radius:6px;transform-origin:left}
  .nt-toast.info    .nt-progress-bar{background:#3b82f6}
  .nt-toast.success .nt-progress-bar{background:#22c55e}
  .nt-toast.warning .nt-progress-bar{background:#f59e0b}
  .nt-toast.error   .nt-progress-bar{background:#ef4444}
</style></head><body>
<div id="toast-root"></div>
<script src="toast-preload.js"></script>
</body></html>
